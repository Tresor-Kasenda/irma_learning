services:
  app:
    build:
      context: .
      target: app-production
    env_file: ${APP_ENV_FILE:-.env.production}
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: mysql
      REDIS_HOST: redis
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-false}"
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    build:
      context: .
      target: nginx-production
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - storage_data:/var/www/html/storage:ro
    depends_on:
      - app
    restart: unless-stopped

  queue:
    build:
      context: .
      target: app-production
    command: php artisan queue:work redis --queue=pdf-extraction,default --sleep=3 --tries=3 --timeout=600 --max-time=3600
    env_file: ${APP_ENV_FILE:-.env.production}
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: mysql
      REDIS_HOST: redis
      RUN_MIGRATIONS: "false"
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped

  scheduler:
    build:
      context: .
      target: app-production
    command: php artisan schedule:work
    env_file: ${APP_ENV_FILE:-.env.production}
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: mysql
      REDIS_HOST: redis
      RUN_MIGRATIONS: "false"
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    env_file: ${APP_ENV_FILE:-.env.production}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  storage_data:
