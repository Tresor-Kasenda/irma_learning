services:
  app:
    build:
      context: .
      target: app-development
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      APP_KEY: ${APP_KEY:?APP_KEY must be set in .env}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: irma_learning
      DB_USERNAME: irma
      DB_PASSWORD: irma_local
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      RUN_MIGRATIONS: "true"
    volumes:
      - ./:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  queue:
    build:
      context: .
      target: app-development
    command: php artisan queue:work redis --queue=pdf-extraction,default --sleep=1 --tries=1 --timeout=600
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      APP_KEY: ${APP_KEY:?APP_KEY must be set in .env}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: irma_learning
      DB_USERNAME: irma
      DB_PASSWORD: irma_local
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      RUN_MIGRATIONS: "false"
    volumes:
      - ./:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      app:
        condition: service_started

  vite:
    image: node:22-bookworm-slim
    working_dir: /var/www/html
    command: >-
      sh -c 'if [ ! -d node_modules/.vite ]; then npm ci; fi; npm run dev -- --host 0.0.0.0 --port 5173'
    ports:
      - "5173:5173"
    volumes:
      - ./:/var/www/html
      - node_modules:/var/www/html/node_modules

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: irma_learning
      MYSQL_USER: irma
      MYSQL_PASSWORD: irma_local
      MYSQL_ROOT_PASSWORD: root_local
    ports:
      - "33060:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -proot_local --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "63790:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.24
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  mysql_data:
  node_modules:
  redis_data:
  vendor:
